[project]
name = "reasoning-ledger-integration-tests"
version = "0.0.0"
description = "Integration tests for the workspace reasoning-ledger SDK against a running api-server."
requires-python = ">=3.12"
dependencies = [
    "reasoning-ledger>=1.0.0",
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv.sources]
reasoning-ledger = { path = "../../python-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
