[project]
name = "reasoning-ledger"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Python SDK for the Reasoning Ledger, an append-only audit trail for AI agent reasoning."
readme = "README.md"
authors = [
    { name = "Arslan Ablikim", email = "arslan.ablikim0@gmail.com" }
]
keywords = ["ai-agents", "audit-trail", "audit-log", "reasoning", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/StairAI/Reasoning-Ledger"
Documentation = "https://github.com/StairAI/Reasoning-Ledger/tree/master/python-sdk#readme"
Issues = "https://github.com/StairAI/Reasoning-Ledger/issues"
Changelog = "https://github.com/StairAI/Reasoning-Ledger/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/reasoning_ledger/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PERF", "S"]
ignore = ["S101"]
