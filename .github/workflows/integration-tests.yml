name: Integration Tests (deployed server)

# Manual: check a deployed server against the SDKs on this branch, for example
# after releasing. Pushes and pull requests run .github/workflows/tests.yml
# instead, which starts its own server on a throwaway database.
#
# The server must run the same release as the SDKs being tested: SDK 1.0 writes
# schema 0.4, which older servers reject.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the server to test
        default: https://stg-api.stair-ai.com
        required: true

jobs:
  integration-tests:
    name: Integration tests against a deployed server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STAIRAI_STAGING_BASE_URL: ${{ inputs.base_url }}
      STAIRAI_STAGING_API_KEY: ${{ secrets.STAIRAI_STAGING_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python integration test dependencies
        working-directory: integration-tests/python
        run: uv sync --locked

      # The suites import the workspace SDK, so build the TypeScript one first.
      - name: Build TypeScript SDK
        run: pnpm --dir typescript-sdk build

      # A run asked for by hand should say what is wrong, not skip quietly.
      - name: Check the server and the API key
        run: |
          if [ -z "$STAIRAI_STAGING_API_KEY" ]; then
            echo "::error::The STAIRAI_STAGING_API_KEY secret is not set for this repository"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$STAIRAI_STAGING_BASE_URL/v1/owners/me" \
            -H "X-API-Key: $STAIRAI_STAGING_API_KEY" \
            --max-time 10) || STATUS=0
          if [ "$STATUS" != "200" ]; then
            echo "::error::$STAIRAI_STAGING_BASE_URL/v1/owners/me answered HTTP $STATUS with the configured key (expected 200)"
            exit 1
          fi

      - name: Run TypeScript integration tests
        working-directory: integration-tests/typescript
        run: pnpm test

      - name: Run Python integration tests
        working-directory: integration-tests/python
        run: uv run --locked pytest -v
