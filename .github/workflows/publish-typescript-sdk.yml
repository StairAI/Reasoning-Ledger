name: Publish TypeScript SDK to npm

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # npm 11.5.1+ (required for OIDC) ships with Node 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter typescript-sdk...

      - name: Build
        working-directory: typescript-sdk
        run: pnpm build

      # develop publishes pre-releases under the `next` tag, master publishes
      # releases under `latest`, and a version already on npm is an error — not
      # a silent skip, and never an overwrite.
      - name: Check the version against this branch and npm
        id: release
        working-directory: typescript-sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=next; EXPECTED=develop ;;
            *)   TAG=latest; EXPECTED=master ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::version $VERSION publishes to '$TAG', which is only allowed from $EXPECTED (this run is on $GITHUB_REF_NAME)"
            exit 1
          fi
          if npm view "reasoning-ledger-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::error::reasoning-ledger-sdk@$VERSION is already on npm; bump the version"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to the '$TAG' tag"

      - name: Publish to npm
        working-directory: typescript-sdk
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
